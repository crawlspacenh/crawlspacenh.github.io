baseURL = 'https://crawlspacenh.com/'
locale = 'en-us'
title = 'Crawlspace'
theme = "hugo-split-theme"
disableKinds = ["rss", "taxonomy", "term"]

# Gigs are pages dated in the future; without this Hugo skips them.
buildFuture = true
timeZone = 'America/New_York'

# Local preview mode
relativeURLs = true
uglyURLs = true

# Copyright
copyright = "&copy;2024 Crawlspace NH"

# Site Config
ignoreLogs = ['warning-goldmark-raw-html']

# Files to ignore when building (not copied to public/)
ignoreFiles = [
  '\.py$',        # Python scripts
  '\.sh$',        # Shell scripts
  'CLAUDE\.md',   # Claude Code instructions
  'README\.md',   # Repository readme
  'TODO\.md',     # Todo file
  'TESTING\.md'   # Testing documentation
]

# Goldmark Render Engine Settings
[markup.goldmark.renderer]
unsafe = true # Allows embedding HTML in Markdown

[services]
[services.googleAnalytics]
ID = "G-42STEVR9W0"

# Band-editable settings (tagline, background, links) live in data/site.yml.
[params]
author = "Crawlspace NH"
description = "The best little jam band in New Hampshire"
twitterHandle = "crawlspacenh"
favicon = "favicon.ico"

[params.visual]
[params.visual.image]
enable = true
position = "center center"

# The original template is released under the Creative Commons Attribution 3.0 License.
# Please keep the original attribution link when using for your own project.
# If you'd like to use the template without the attribution, you can check out
# the license option via the template author's website: https://onepagelove.com/split

[server]
[[server.headers]]
for = '/**'
[server.headers.values]
Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://dummyimage.com; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https://formspree.io https://*.google-analytics.com"
Referrer-Policy = 'strict-origin-when-cross-origin'
X-Content-Type-Options = 'nosniff'
X-Frame-Options = 'DENY'
X-XSS-Protection = '1; mode=block'

[privacy]
[privacy.youTube]
disable = false
privacyEnhanced = false
